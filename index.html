
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokexplorer</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Pokexplorer</h1>
    </header>

    <main>

        <section class="search-section">
            <h2>Find a Pokémon</h2>

            <form id="search-form">
                <label for="pokemon-input">
                    Enter a Pokémon name or number:
                </label>

                <input
                    type="text"
                    id="pokemon-input"
                    placeholder="Enter a Pokemon!"
                >

                <button type="submit">Search</button>
            </form>
        </section>

        <p id="message" role="status"></p>

        <section class="results">
            <h2>Pokémon</h2>

            <div id="pokemon-card" hidden>
                <h3 id="pokemon-name"></h3>

                <img id="pokemon-image" src="" alt="">
            </div>
        </section>

    </main>
</body>
</html>
